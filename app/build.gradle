plugins {
    id 'com.android.application'
}

def apiUrl = System.getenv('API_URL') ?: 'https://tpypay.DevUgly.workers.dev'
def apiKey = System.getenv('API_KEY') ?: ''

android {
    namespace 'com.tpypay.smsgateway'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tpypay.smsgateway'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'

        buildConfigField 'String', 'API_URL', "\"${apiUrl}\""
        buildConfigField 'String', 'API_KEY', "\"${apiKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
